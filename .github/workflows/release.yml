name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/release_metadata.py plan --github-output "$GITHUB_OUTPUT"
  release:
    needs: metadata
    if: needs.metadata.outputs.release == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      SIGN_IDENTITY: ${{ vars.APPLE_SIGN_IDENTITY }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare release commit and tag
        run: |
          python3 scripts/release_metadata.py prepare "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/CopyCatCore/Version.swift CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "CopyCat $VERSION"
          git push origin HEAD:main --follow-tags
      - run: |
          python3 scripts/test-release-metadata.py
          swift test
      - name: Configure release signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: ./scripts/setup-ci-signing.sh
      - name: Build universal app
        env:
          UNIVERSAL: '1'
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/bundle.sh
      - name: Package and verify
        run: |
          lipo CopyCat.app/Contents/MacOS/CopyCat -verify_arch arm64 x86_64
          codesign --verify --deep --strict CopyCat.app
      - name: Notarize and staple
        run: ./scripts/sign-notarize.sh
      - name: Sign update archive and feed
        env:
          UNIVERSAL: '1'
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: v${{ needs.metadata.outputs.version }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:?Configure the Sparkle signing secret before releasing}"
          ./scripts/appcast.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.metadata.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/CopyCat-macOS.zip release-artifacts/CopyCat-macOS.md release-artifacts/SHA256SUMS.txt release-artifacts/appcast.xml --verify-tag --title "CopyCat ${RELEASE_TAG#v}" --generate-notes
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p /tmp/copy-cat-release
          gh release download "$RELEASE_TAG" --dir /tmp/copy-cat-release
          (cd /tmp/copy-cat-release && shasum -a 256 -c SHA256SUMS.txt)
          python3 scripts/check-appcast.py /tmp/copy-cat-release/appcast.xml /tmp/copy-cat-release/CopyCat-macOS.zip /tmp/copy-cat-release/CopyCat-macOS.md "$VERSION"
          curl --fail --location --silent --show-error https://github.com/0x63616c/copy-cat/releases/latest/download/appcast.xml -o /tmp/copy-cat-release/latest-appcast.xml
          cmp /tmp/copy-cat-release/appcast.xml /tmp/copy-cat-release/latest-appcast.xml
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/copy-cat-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/copy-cat-developer-id.p12" "$RUNNER_TEMP/copy-cat-notary.p8"
