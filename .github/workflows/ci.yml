name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Conventional Commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 scripts/release_metadata.py check "origin/$BASE_REF...HEAD"
          elif [[ "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            python3 scripts/release_metadata.py check "$BEFORE..$SHA"
          fi
      - name: Build and test
        run: |
          python3 scripts/test-release-metadata.py
          swift test
      - name: Validate website and scripts
        run: |
          python3 scripts/check-site.py
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Verify app bundle
        run: ./scripts/bundle.sh
